<style>
    #starfield{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}
body {
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
    margin: 0;
    padding: 0;
    background:#020617;
    min-height: 100vh;
    color: #f1f5f9;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;
    background:
        rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.4);
    border:
        1px solid rgba(255,255,255,0.15);
}
h1 {
    color: #38bdf8;
    font-size: 2.6rem;
    margin-bottom: 10px;
}
.subtitle {
    color: #cbd5e1;
    font-size: 1.2rem;
}
.avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    margin: 30px auto;
    display: block;
    object-fit: cover;
    border: 6px solid #38bdf8;
    box-shadow:
        0 0 30px rgba(56,189,248,0.7);
}
section {
    margin-top: 30px;
    padding: 25px;
    background:
        rgba(255,255,255,0.05);
    border-radius: 18px;
    transition: all 0.3s ease;
}
section:hover {
    transform: translateY(-5px);
    background:
        rgba(255,255,255,0.08);
}
h2 {
    color: #38bdf8;
}
p {
    line-height: 1.8;
}
a {
    color: #38bdf8;
    text-decoration: none;
}
a:hover {
    color: #7dd3fc;
}
small {
    color: #94a3b8;
}
</style>
</head>
    <script>
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
for(let i=0;i<200;i++) {
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        v:Math.random()*0.3+0.05
    });
}
function draw() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
    ctx.fillStyle='white';
    stars.forEach(star=>{
        ctx.beginPath();
        ctx.arc(
            star.x,
            star.y,
            star.r,
            0,
            Math.PI*2
        );
        ctx.fill();
        star.y += star.v;
        if(star.y > canvas.height){
            star.y = 0;
            star.x =
            Math.random()*canvas.width;
        }
    });
    requestAnimationFrame(draw);
}
draw();
</script>
<body>
    <canvas id="starfield"></canvas>
    <div class="container">
