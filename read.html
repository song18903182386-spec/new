            transition: 0.3s;

        .container {

            margin: 100px auto 60px;

            text-align:center;

            position:relative;

            animation: fadeIn 1s ease forwards;

        }

        @keyframes fadeIn {

        h1 {
            color: var(--main-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {

            margin-bottom: 30px;

        .intro {
            font-size: 1rem;
            line-height: 1.9;

            h1 {

<canvas id="starfield"></canvas>

<div class="container">
    <h1>阅读思考</h1>
    <div class="subtitle">阅读、观察与思考</div>

    <div class="intro">
        记录那些值得反复回看的文字。<br><br>
        有些答案来自书本。<br>
        有些答案来自经历。<br>
        更多答案来自时间。
    </div>

    <div class="part">
        <div class="part-title">长期主义</div>
        <div class="item">
            <h3>关于成长、坚持与复利</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="part">
        <div class="part-title">创业感悟</div>
        <div class="item">
            <h3>经营企业过程中的思考</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="part">
        <div class="part-title">人生感悟</div>
        <div class="item">
            <h3>关于生活、家庭与时间</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="part">
        <div class="part-title">独立思考</div>
        <div class="item">
            <h3>关于判断、选择与认知</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="part">
        <div class="part-title">阅读笔记</div>
        <div class="item">
            <h3>记录阅读过程中的收获</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="part">
        <div class="part-title">随笔</div>
        <div class="item">
            <h3>一些零散却值得记录的想法</h3>
            <span class="tag">建设中</span>
        </div>
    </div>

    <div class="footer-note">
        很多事情，<br>
        当时觉得重要。<br>
        多年以后未必如此。<br><br>
        很多事情，<br>
        当时觉得普通。<br>
        回头再看却意义非凡。<br><br>
        因此记录下来。
    </div>
</div>

<script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        createStars();
    }
    window.addEventListener('resize', resize);
    resize();

    function createStars() {
        stars = [];
        for(let i=0;i<200;i++){
            stars.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5});
        }
    }

    function draw(){
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = "#fff";
        stars.forEach(s=>{
            ctx.beginPath();
            ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
